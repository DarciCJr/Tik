name: Deploy Tik

on:
  push:
    branches:
      - claude/tiktok-api-automation-rye21c
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild container
        run: |
          cd ~/Tik
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          docker compose up -d --build
